## Disabled 2026-11-12: no physical button is wired to PI1, PI9 or PI13 yet, so
## the pins float, and klippy.log has shown callbacks firing at startup.  POWER_OFF
## now really cuts mains, so a floating POWER pin means an outage mid-print.
## Re-enable a section only once its button is wired, with a defined idle level
## (a pull resistor) and the polarity the wiring needs.
## See docs/adr/0022-power-off-relay-on-ps-on.md, Revisions.

#[gcode_button POWER]
#pin: POWER_PIN
#press_gcode:
#    POWER_OFF

#[gcode_button RESUME]
#pin: RESUME_PIN
#press_gcode:
#    RESUME

#[gcode_button PAUSE]
#pin: PAUSE_PIN
#press_gcode:
#    PAUSE
