# First-layer squish test: 9 small squares in a 3x3 grid, each printed at a
# different Z offset. Static grid instead of Ellis' live-babystep-while-watching
# method -- produces a physical artifact you compare after the fact instead of
# judging in real time. See docs/adr/0016.
#
# Assumes the caller has already: homed, QGL'd, meshed the grid's footprint
# (BED_MESH_CALIBRATE MESH_MIN/MESH_MAX covering the grid, see docs/TUNING_PLAN.md),
# and heated bed+nozzle to real print temperature. This macro only prints the
# pattern -- it does not home, mesh, or heat.
#
# Square N's Z offset = (N - center_index) * z_step, relative to the probe's
# baked-in z_offset (config/printer/gantry/z_calibration.cfg) -- NOT an absolute
# value. Grid reads row-major, left-to-right/front-to-back; the centre square
# (row 1, col 1) is always the baseline (delta 0).
#
# Each square draws a closed perimeter ring (BORDER rings deep) then fills the
# interior with vertical lines inset past the border -- gives both the classic
# panel/line read AND a wall/edge read like a real part, and it is easier to
# judge than bare stripes. Most print setup is tunable at the call site:
# SQUARE_SIZE, GAP, BORDER, LAYER_HEIGHT, LINE_WIDTH, Z_STEP, START_X, START_Y.

[gcode_macro SQUISH_TEST_GRID]
variable_square_size:  25      ## mm per square (default)
variable_gap:          15      ## mm between squares
variable_layer_height:  0.25   ## mm -- deliberately thick, Ellis' squish-test convention
variable_line_width:    0.48   ## mm -- matches Tier A first_layer_line_width (120% of 0.4mm)
variable_z_step:        0.04   ## mm Z delta between adjacent squares
variable_border:        1      ## number of closed perimeter rings per square (0 = fill only)
variable_start_x:       135    ## mm, front-left corner of square (row0,col0)
variable_start_y:       115
variable_print_speed:   20     ## mm/s -- slow, per Ellis' first-layer squish guidance
variable_travel_speed:  150    ## mm/s
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("SQUISH_TEST_GRID: home first") }
    {% endif %}

    {% set square = params.SQUARE_SIZE|default(square_size)|float %}
    {% set gap = params.GAP|default(gap)|float %}
    {% set lh = params.LAYER_HEIGHT|default(layer_height)|float %}
    {% set lw = params.LINE_WIDTH|default(line_width)|float %}
    {% set z_step = params.Z_STEP|default(z_step)|float %}
    {% set rings = params.BORDER|default(border)|int %}
    {% set start_x = params.START_X|default(start_x)|float %}
    {% set start_y = params.START_Y|default(start_y)|float %}
    {% set pspd = params.PRINT_SPEED|default(print_speed)|float %}
    {% set tspd = params.TRAVEL_SPEED|default(travel_speed)|float %}

    {% set filament_diameter = printer.configfile.settings.extruder.filament_diameter|float %}
    {% set filament_area = 3.14159265 * (filament_diameter / 2) ** 2 %}
    {% set e_per_mm = (lw * lh) / filament_area %}
    {% set pitch = square + gap %}

    SAVE_GCODE_STATE NAME=SQUISH_TEST_GRID
    G90
    M83
    G0 Z10 F{tspd * 60}

    {% for row in range(3) %}
        {% for col in range(3) %}
            {% set idx = row * 3 + col %}
            {% set z_delta = (idx - 4) * z_step %}
            {% set sx = start_x + col * pitch %}
            {% set sy = start_y + row * pitch %}

            {% set inner_min = rings * lw %}
            {% set inner_extent = square - 2 * inner_min %}

            SET_GCODE_OFFSET Z={'%.3f' % z_delta} MOVE=0
            RESPOND MSG="Square {idx + 1}/9 (row={row},col={col}): z_delta={'%.3f' % z_delta}mm"
            G0 X{'%.3f' % sx} Y{'%.3f' % sy} F{tspd * 60}
            G1 Z{lh} F{tspd * 60}

            ## closed perimeter ring(s) -- the wall/edge read
            {% for r in range(rings) %}
                {% set i = r * lw %}
                {% set side = square - 2 * i %}
                {% set x0 = sx + i %}
                {% set x1 = sx + square - i %}
                {% set y0 = sy + i %}
                {% set y1 = sy + square - i %}
                G0 X{'%.3f' % x0} Y{'%.3f' % y0} F{tspd * 60}
                G1 X{'%.3f' % x1} Y{'%.3f' % y0} E{'%.4f' % (side * e_per_mm)} F{pspd * 60}
                G1 X{'%.3f' % x1} Y{'%.3f' % y1} E{'%.4f' % (side * e_per_mm)} F{pspd * 60}
                G1 X{'%.3f' % x0} Y{'%.3f' % y1} E{'%.4f' % (side * e_per_mm)} F{pspd * 60}
                G1 X{'%.3f' % x0} Y{'%.3f' % y0} E{'%.4f' % (side * e_per_mm)} F{pspd * 60}
            {% endfor %}

            ## interior vertical fill lines, inset past the ring
            {% set fill_start_x = sx + inner_min %}
            {% set fill_end_x = sx + inner_min + inner_extent %}
            {% set num_lines = (inner_extent / lw) | round(0, 'ceil') | int %}
            {% for i in range(num_lines) %}
                {% set raw_x = fill_start_x + i * lw %}
                {% set x = [raw_x, fill_end_x] | min %}
                {% set y_lo = sy + inner_min %}
                {% set y_hi = y_lo + inner_extent %}
                {% if i % 2 == 0 %}
                    G0 X{'%.3f' % x} Y{'%.3f' % y_lo} F{tspd * 60}
                    G1 Y{'%.3f' % y_hi} E{'%.4f' % (inner_extent * e_per_mm)} F{pspd * 60}
                {% else %}
                    G0 X{'%.3f' % x} Y{'%.3f' % y_hi} F{tspd * 60}
                    G1 Y{'%.3f' % y_lo} E{'%.4f' % (inner_extent * e_per_mm)} F{pspd * 60}
                {% endif %}
            {% endfor %}

            G0 Z10 F{tspd * 60}
        {% endfor %}
    {% endfor %}

    SET_GCODE_OFFSET Z=0 MOVE=0
    M82
    RESTORE_GCODE_STATE NAME=SQUISH_TEST_GRID
    RESPOND MSG="Squish test grid done. Centre square (row1,col1) = baseline z_offset."