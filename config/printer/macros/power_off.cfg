## POWER_OFF shuts the host down; it does not touch PS_ON.  The host-poweroff
## hook (system/psu-relay-poweroff.sh) calls _PSU_RELAY_RELEASE while Klipper is
## still up -- on poweroff or halt, never on reboot -- and the relay module cuts
## mains 7.5 s later.  So the screen's and Mainsail's "shut down" cut mains too.
## See docs/adr/0022-power-off-relay-on-ps-on.md.
[gcode_macro POWER_OFF]
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off
    #SET_FAN_SPEED FAN=Exhaust SPEED=0   ; turn exhaust fan off
    #SET_FAN_SPEED FAN=BedFans SPEED=0   ; bed fan off
    #SET_PIN PIN=caselight VALUE=0       ; turn case light off
    {action_call_remote_method("shutdown_machine")}

## Called only by the host-poweroff hook.  Heaters go off first so none is left
## driven when Klipper is stopped a moment later.  M400 is what makes this work:
## SET_PIN only queues the change ~0.25 s ahead and sends it when the queue
## flushes, and systemd stops Klipper ~35 ms after this returns -- without the
## wait the change can die in the host's queue (it did, 2026-11-12 11:52).
## The re-assert is cancelled in case this runs within 2 s of "ready".
[gcode_macro _PSU_RELAY_RELEASE]
gcode:
    UPDATE_DELAYED_GCODE ID=PSU_RELAY_ASSERT DURATION=0
    TURN_OFF_HEATERS
    SET_PIN PIN=PS_ON VALUE=0
    M400
