###############################################################################
# Between-session keep-warm
#
# Typical workflow here is back-to-back 5-10 min prints with a 10-15 min gap to
# remove the part and clean the plate. Letting the bed (and therefore the frame)
# cool during that gap throws away the thermal state and forces the next session
# to soak again.
#
# STANDBY_WARM holds the bed at the last print's target so the next PRINT_START
# passes its thermal gate immediately.
#
# See docs/adr/0005-between-session-keep-warm.md
#
# !! [idle_timeout] is 1800s (30 min) and runs TURN_OFF_HEATERS. The auto-off
# !! below is deliberately SHORTER (25 min) so standby ends on its own terms
# !! rather than being silently killed by idle_timeout.
###############################################################################

[gcode_macro STANDBY_WARM]
description: Hold the bed warm between prints. STANDBY_WARM [TEMP=<c>] [MINUTES=<n>]
variable_timeout_min: 25          ## must stay < [idle_timeout] 1800s / 60 = 30 min
variable_last_temp: 0             ## remembers the last held temperature
gcode:
    {% set default_temp = printer.heater_bed.target if printer.heater_bed.target > 0
                          else printer['gcode_macro STANDBY_WARM'].last_temp|default(0) %}
    {% set temp    = params.TEMP|default(default_temp)|float %}
    {% set minutes = params.MINUTES|default(timeout_min)|int %}

    {% if temp <= 0 %}
        { action_respond_info("STANDBY_WARM: no temperature to hold, skipping") }
    {% else %}
        SET_GCODE_VARIABLE MACRO=STANDBY_WARM VARIABLE=last_temp VALUE={temp}
        M140 S{temp}
        ##  Show the standby colour so the machine does not look switched off while
        ##  it is still holding heat (and, from PRINT_END, still holding the motors).
        STATUS_READY
        { action_respond_info("Standby: holding bed at %.0fc for %d min" % (temp, minutes)) }
        UPDATE_DELAYED_GCODE ID=_STANDBY_WARM_OFF DURATION={minutes * 60}
    {% endif %}

[gcode_macro STOP_STANDBY_WARM]
description: Cancel the between-session keep-warm and let the bed cool
gcode:
    UPDATE_DELAYED_GCODE ID=_STANDBY_WARM_OFF DURATION=0
    ## Guard on print_stats, NOT idle_timeout. idle_timeout.state is a *busy*
    ## flag -- Klipper sets it to "Printing" while executing ANY command,
    ## including this macro, so an idle_timeout guard here is always false at
    ## the exact moment it matters and the bed never gets turned off.
    {% if printer.print_stats.state != "printing" %}
        M140 S0
        M84                     # release motors too -- see _STANDBY_WARM_OFF
        STATUS_OFF              # machine is cooling and unpowered; look it
    {% endif %}
    { action_respond_info("Standby cancelled") }

[delayed_gcode _STANDBY_WARM_OFF]
gcode:
    {% if printer.print_stats.state != "printing" %}
        M140 S0
        ##  Release the motors together with the bed. PRINT_END deliberately skips
        ##  M84 while standby holds, so that quad_gantry_level.applied survives and
        ##  the next print only needs one QGL. Standby ending is the right moment to
        ##  give that up: the machine is cooling, so the next start is a cold one and
        ##  should do both QGL passes anyway.
        M84
        STATUS_OFF              # standby colour off -- machine is genuinely idle now
        { action_respond_info("Standby expired - bed cooling, motors released") }
    {% endif %}

###############################################################################
# Soak polling helper
#
# One 15s step of the thermal-readiness dwell. PRINT_START emits a fixed number
# of these, so the total is hard-bounded, but each one re-reads the chamber
# temperature when it executes -- so once the gate is reached the rest are
# instant no-ops.
#
# Why not a Jinja loop or recursion:
#   * a {% for %} inside one macro evaluates printer.* ONCE, at expansion time,
#     so every iteration would see the same stale temperature
#   * a macro that calls itself is rejected by Klipper ("called recursively")
###############################################################################

[gcode_macro _SOAK_STEP]
description: One bounded step of the chamber soak dwell; no-op once the gate is met
gcode:
    {% set gate = params.GATE|float %}
    {% if printer['temperature_fan chamber'].temperature|float < gate %}
        G4 P15000
    {% endif %}
