###############################################################################
# Between-session keep-warm
#
# Typical workflow here is back-to-back 5-10 min prints with a 10-15 min gap to
# remove the part and clean the plate. Letting the bed (and therefore the frame)
# cool during that gap throws away the thermal state and forces the next session
# to soak again.
#
# STANDBY_WARM holds the bed at the last print's target so the next PRINT_START
# passes its thermal gate immediately.
#
# See docs/adr/0005-between-session-keep-warm.md
#
# !! [idle_timeout] is 1800s (30 min) and runs TURN_OFF_HEATERS. The auto-off
# !! below is deliberately SHORTER (25 min) so standby ends on its own terms
# !! rather than being silently killed by idle_timeout.
###############################################################################

[gcode_macro STANDBY_WARM]
description: Hold the bed warm between prints. STANDBY_WARM [TEMP=<c>] [MINUTES=<n>]
variable_timeout_min: 25          ## must stay < [idle_timeout] 1800s / 60 = 30 min
variable_last_temp: 0             ## remembers the last held temperature
gcode:
    {% set default_temp = printer.heater_bed.target if printer.heater_bed.target > 0
                          else printer['gcode_macro STANDBY_WARM'].last_temp|default(0) %}
    {% set temp    = params.TEMP|default(default_temp)|float %}
    {% set minutes = params.MINUTES|default(timeout_min)|int %}

    {% if temp <= 0 %}
        { action_respond_info("STANDBY_WARM: no temperature to hold, skipping") }
    {% else %}
        SET_GCODE_VARIABLE MACRO=STANDBY_WARM VARIABLE=last_temp VALUE={temp}
        M140 S{temp}
        { action_respond_info("Standby: holding bed at %.0fc for %d min" % (temp, minutes)) }
        UPDATE_DELAYED_GCODE ID=_STANDBY_WARM_OFF DURATION={minutes * 60}
    {% endif %}

[gcode_macro STOP_STANDBY_WARM]
description: Cancel the between-session keep-warm and let the bed cool
gcode:
    UPDATE_DELAYED_GCODE ID=_STANDBY_WARM_OFF DURATION=0
    {% if printer.idle_timeout.state|upper != "PRINTING" %}
        M140 S0
    {% endif %}
    { action_respond_info("Standby cancelled") }

[delayed_gcode _STANDBY_WARM_OFF]
gcode:
    {% if printer.idle_timeout.state|upper != "PRINTING" %}
        M140 S0
        { action_respond_info("Standby expired - bed cooling") }
    {% endif %}
