# https://docs.vorondesign.com/community/howto/alchemyEngine/Chamber_temperature_exhaust_fan.html
# See printer.cfg for companion fan control for Chamber

##############################################################
# 	Print Start / End                                        #
#   https://github.com/jontek2/A-better-print_start-macro    #
##############################################################

[gcode_macro PRINT_START]
variable_clear_nozzle_enabled: 1
variable_preheated_quad_gantry_level: 1
variable_filament_sensor_enabled: 1                 ## Enable the filament sensors (EBB + SFS V2.0)
variable_use_bed_mesh: 1                            ## Wether to use the bed mesh or not
variable_bed_mesh_config: 'default'                 ## Default bed mesh config to use
variable_mesh_bed_before_print: 1                   ## Mesh before each print (ADAPTIVE, so it is cheap)
variable_adaptive_margin: 5                         ## mm of mesh margin around the print area (brim/skirt)
variable_heatsoak_enabled: 1                        ## Enable the thermal-readiness gate
variable_use_nevermore_filter: 1                    ## Controls wether to use Nevermore filter
variable_preheated_z_home_temp: 150
## Refuse a file whose slicer heated the hotend before calling PRINT_START.
## See docs/adr/0017-refuse-slicer-preheat.md. Set to 0 to bypass for one print.
variable_refuse_slicer_preheat: 1
## Thermal readiness gate -- see docs/adr/0003-temperature-gated-soak.md
## Gate on measured chamber temperature instead of a fixed timer. TEMPERATURE_WAIT
## returns immediately when already in range, so a warm machine waits 0 seconds.
## Gates are material-dependent: with a 60c bed the chamber never reaches 40c, so a
## flat 40c gate would hang forever.
variable_soak_gate_abs: 40                          ## chamber gate when bed > 90c  (measured plateau 44-47c)
variable_soak_gate_petg: 30                         ## chamber gate when bed > 65c
## soak_max_min is a HARD CAP on the soak dwell, bounded on purpose: an unbounded
## TEMPERATURE_WAIT cannot be cancelled, because CANCEL_PRINT queues behind it.
## (Keep these comments at column 0 -- an INDENTED comment line is parsed as a
## continuation of the preceding value, not as a comment.)
variable_soak_max_min: 6
## Part-cooling fan % used purely to stir chamber air during the soak dwell.
## The Nevermore (MP8:FAN2) recirculates and the chamber exhaust (MP8:FAN3) vents;
## only the exhaust hurts a soak, and the gate now raises its target out of the way.
variable_soak_circulate_pct: 40
gcode:
    # This part fetches data from your slicer. Such as bed temp, extruder temp, Chamber temp and size of your printer.
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|default("260")|int %}
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
    {% set mesh_min_y = printer.configfile.config["bed_mesh"]["mesh_min"].split(",")[1]|int %}
    {% set mesh_max_x = printer.configfile.config["bed_mesh"]["mesh_max"].split(",")[0]|int %}
    {% set heatsoack_duration = 5 %}

    ##  Fail fast if the slicer already heated the hotend (M104/M109 before
    ##  PRINT_START). Measured cost when it slips through: 74-84 s heating to 260c,
    ##  then 90-120 s of uncancellable cool-down for the TAP guard, nozzle oozing
    ##  over the bed the whole time, and on 2026-09-19 an emergency stop because
    ##  CANCEL could not land. See docs/adr/0017-refuse-slicer-preheat.md.
    {% if refuse_slicer_preheat == 1 and printer.extruder.target|float > preheated_z_home_temp %}
        { action_raise_error("PRINT_START refused: hotend target is already %.0fc, so the slicer emitted M104/M109 before PRINT_START. Remove the heating lines from the machine start gcode (docs/SLICER_SETUP.md, section 6) and re-slice. Bypass once with SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=refuse_slicer_preheat VALUE=0" % printer.extruder.target) }
    {% endif %}
    SHOW_MESSAGE MSG="Starting print"  # Displays info
    # Homes the printer, sets absolute positioning and updates the Stealthburner leds.
    CANCEL_HEAT_SOAK
    ##  Chamber EXHAUST target (MP8:FAN3). A [temperature_fan] runs its fan ABOVE
    ##  its target, so a low target here means the exhaust vents heat out of the
    ##  chamber for the whole warm-up -- measured: it held the chamber at ~38c and
    ##  the soak could barely climb (0.29 C/min). Hold it at/above the soak gate
    ##  until we are actually up to temperature; PRINT_START sets M141 S50 before
    ##  printing and PRINT_END pulls it back to 40 to purge.
    ##  This is still over-temperature protection: the fan engages above the target,
    ##  and the chamber BME280 is limited to max_temp 70. Fume handling is the
    ##  Nevermore's job (MP8:FAN2, recirculating + filtering), not the exhaust's.
    {% set warmup_chamber = [ target_chamber,
                              (soak_gate_abs if params.BED|int > 90
                               else (soak_gate_petg if params.BED|int > 65 else 0)) + 10 ] | max %}
    M141 S{warmup_chamber}       # Exhaust held above the soak gate during warm-up

    ##  Start the hotend heating HERE, at the very top, not just before M190.
    ##  Measured: with STANDBY_WARM holding the bed, M190 now returns in ~2s, so a
    ##  preheat placed just before it gets no runway -- the hotend was still at 52c
    ##  when CLEAN_NOZZLE ran, and CLEAN_NOZZLE's M109 then blocked for ~46s.
    ##  Issued here it heats during homing (~41s) and the pre-QGL (~94s) instead,
    ##  which are dead time anyway. Non-blocking, and 150c is below
    ##  min_extrude_temp (160) so it cannot ooze while it waits.
    M104 S{preheated_z_home_temp}
    ##  Same idea for the bed: start it NOW, non-blocking. Measured 2026-09-19 on a
    ##  cold start: bed 28c -> 100c took 330 s, and none of it overlapped homing or
    ##  the pre-QGL because M190 only came after them. On a warm start (standby
    ##  holding) this is a no-op. See docs/adr/0003 (revision 2026-09-19).
    M140 S{target_bed}

    _CASELIGHT_ON                # Turn on the caselights
    status_homing                # Sets SB-leds to homing-mode
    _CG28                        # Conditoinal G28 - Full home (XYZ) if not already homed
    _Party_Homing                # Party Lights
    G90                          # Absolute position

    ##  Uncomment for bed mesh (1 of 2)
    BED_MESH_CLEAR       # Clears old saved bed mesh (if any)

    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE={filament_sensor_enabled} 
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE={filament_sensor_enabled}
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE={filament_sensor_enabled}

    ##  Quad gantry level early so if there is an issue
    SHOW_MESSAGE MSG="Pre Quad Gantry Leveling"     # Displays info
    status_leveling                                     # Sets SB-leds to leveling-mode
    _Party_Leveling                                     # Party Lights
    ##  Cold start only: let the nozzle REACH probe temperature before the first
    ##  QGL. The probe reading drifted -0.319 -> -0.55 mm while the hotend climbed to
    ##  150c mid-QGL (2026-08-03), blew samples_tolerance and CANCEL_PRINT fired.
    ##  On a warm start QGL is still applied, this block is skipped, and the wait is
    ##  0 s. The bed is already heating (M140 above), so the wait is free on a cold
    ##  start too. See docs/adr/0019-cold-start-qgl-waits-for-probe-temp.md.
    {% if printer.quad_gantry_level.applied == False %}
        SHOW_MESSAGE MSG="Nozzle to {preheated_z_home_temp}c before QGL"
        M109 S{preheated_z_home_temp}
    {% endif %}
    _QUAD_GANTRY_LEVEL_IF_NEEDED                        # Levels the buildplate via QGL if not apply

    ##  Nevermore filter
    {% if use_nevermore_filter == 1 %}
      BED_FANS_FAST                      # Turns on the nevermore
    {% endif %}

    # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak.
    {% if params.BED|int > 90 %}
        {% set heatsoack_duration = 15 %}
    # If the bed temp is over 65c, then it skips the heatsoak and heats up to set BED temp with a 10 min soak
    {% elif params.BED|int > 65 %}
        {% set heatsoack_duration = 10 %}
    # Otherwise it skips the heatsoak and just heats up to set temp with a 5 min soak
    {% endif %}

    ##  Remember the bed target for PRINT_END. It cannot read it back itself:
    ##  slicers emit "M140 S0" immediately BEFORE calling PRINT_END (verified --
    ##  M140 S0 on line 7383, PRINT_END on 7384), so by then heater_bed.target
    ##  is already 0 and any "was this an ABS print?" test on it fails.
    SET_GCODE_VARIABLE MACRO=PRINT_END VARIABLE=bed_target VALUE={target_bed}

    SHOW_MESSAGE MSG="Bed: {target_bed}c"                            # Displays info
    status_heating                                                       # Sets SB-leds to heating-mode
    _Party_Heating                                                       # Party Lights
    G1 X{x_wait} Y{y_wait} Z15 F4000                                     # Goes to center of the bed
    
    ##  (hotend preheat now issued at the top of PRINT_START -- see the note there)
    ##  M190 is overridden in heatsoak.cfg to wait only until the bed REACHES the
    ##  target, never for it to cool down to it -- a 55c print after a 100c one used
    ##  to block here for the whole cool-down. See docs/adr/0003 (rev. 2026-09-19).
    M190 S{target_bed}                                                   # Heat bed and wait for target

    ## NOTE: the thermal readiness gate used to sit HERE, immediately after M190.
    ## Measured on the machine that was wrong twice over:
    ##   1. Only the bed was heating the chamber, so it crawled at ~0.29 C/min
    ##      and the gate cost ~15 min.
    ##   2. PRINT_START had already run M141 S{CHAMBER} (36 from the slicer), and
    ##      a [temperature_fan] RUNS THE FAN ABOVE ITS TARGET -- so the exhaust
    ##      fan was at speed 1.0 actively cooling the chamber while the gate
    ##      waited for 40c. The two fought each other.
    ## The gate now lives after CLEAN_NOZZLE + the 150c nozzle preheat + QGL, so
    ## that time counts toward the soak and the hotend contributes heat.
    ## See docs/adr/0003-temperature-gated-soak.md.

    #Go to purge bucket, heat to target temp, purge, cool to 150, wipe nozzle
	{% if clear_nozzle_enabled == 1 %}
		## Z_HOME=0: QUAD_GANTRY_LEVEL below ends with its own G28 Z (see clean_nozzle.cfg)
		## PURGE=0: bare calls now default to a purge at purge_temp_default (230c); the
		## early pre-QGL clean must stay purge-free or it drags the whole thermal
		## ladder to print temp before leveling. See docs/adr/0009 and 0015.
		CLEAN_NOZZLE CLEAN={preheated_z_home_temp} Z_HOME=0 PURGE=0
	{% endif %}
	
	_CASELIGHT_OFF                                       # Turnon case lights to improve TAP acuarcy 

    # Heating nozzle to 150 degrees. This helps with getting a correct Z-home
    {% if (preheated_quad_gantry_level == 1 or mesh_bed_before_print == 1) %}
        _Party_HeatingEx                                 # Party Lights
        SHOW_MESSAGE MSG="QGL Preheat: {preheated_z_home_temp}c"          # Displays info
        M109 S{preheated_z_home_temp}                    # Heats the nozzle to 150c
    {% endif %}
    
    ##  Quad gantry level with final temp after soak
	{% if preheated_quad_gantry_level == 1 %}
		SHOW_MESSAGE MSG="Quad Gantry Leveling"      # Displays info
		status_leveling                                  # Sets SB-leds to leveling-mode
		_Party_Leveling                                  # Party Lights
		QUAD_GANTRY_LEVEL                                # Levels the buildplate via QGL
		_Party_Homing                                    # Party Lights
		G28 Z                                            # Homes Z again after QGL
	{% endif %}

    ##  ---- Thermal readiness gate ----------------------------------------
    ##  Placed here (not after M190) so the nozzle preheat and QGL above have
    ##  already added heat and consumed time. Bounded by design: an unbounded
    ##  TEMPERATURE_WAIT cannot be interrupted, because CANCEL_PRINT queues
    ##  behind it -- verified the hard way on the machine.
    {% if heatsoak_enabled == 1 %}
        {% set chamber_now = printer['temperature_fan chamber'].temperature|float %}
        {% set gate = soak_gate_abs if params.BED|int > 90
                 else (soak_gate_petg if params.BED|int > 65 else 0) %}

        {% if gate > 0 %}
            ##  A [temperature_fan] runs its fan ABOVE the target, so leaving the
            ##  exhaust target below the gate makes the fan fight the soak. Push
            ##  it above the gate first.
            M141 S{gate + 10}

            {% if chamber_now >= gate %}
                SHOW_MESSAGE MSG="Chamber {chamber_now|round(1)}c >= {gate}c - ready"
            {% else %}
                ##  Bounded dwell instead of an open-ended wait: worst case is
                ##  soak_max_min, never a hang.
                ##  Run the part-cooling fan to stir the chamber while we dwell.
                ##  It does not add heat, but it breaks up the stratified layer
                ##  over the bed and moves it around the chamber. Turned off
                ##  again before probing so it cannot disturb the mesh.
                SHOW_MESSAGE MSG="Soak: chamber {chamber_now|round(1)}c -> {gate}c (max {soak_max_min} min)"
                M106 S{ (255 * soak_circulate_pct / 100) | int }
                ##  Bounded AND early-exiting. Each _SOAK_STEP is a separate macro
                ##  invocation, so it re-reads the chamber temperature when it runs
                ##  (a Jinja loop here would evaluate the temperature once, at
                ##  expansion time, and a self-recursive macro is rejected by
                ##  Klipper's "called recursively" guard). Once the gate is reached
                ##  the remaining steps are no-ops and cost nothing. The short
                ##  dwells also leave gaps for a queued CANCEL_PRINT to land.
                {% for _ in range(soak_max_min * 4) %}
                    _SOAK_STEP GATE={gate}
                {% endfor %}
                M107
                SHOW_MESSAGE MSG="Soak done - chamber {printer['temperature_fan chamber'].temperature|round(1)}c"
            {% endif %}
        {% else %}
            SHOW_MESSAGE MSG="Bed {target_bed}c - no chamber gate for this material"
        {% endif %}
    {% endif %}

    ##  Mesh the bed before print -- ADAPTIVE probes only the print's footprint
    ##  (plus adaptive_margin), so a small centred part costs seconds instead of a
    ##  full 11x11 sweep. If the slicer did not emit EXCLUDE_OBJECT_DEFINE, Klipper
    ##  logs "Using full mesh..." and falls back safely -- it does not error.
    {% if mesh_bed_before_print == 1 %}
      SHOW_MESSAGE MSG="Meshing bed (adaptive)"   # Displays info
      status_meshing                              # Sets SB-leds to bed mesh-mode
      BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={adaptive_margin}
    {% endif %}
    
    #Configure bed_mesh if enabled and if no bed mesh has been performing before printing
    {% if use_bed_mesh == 1 %}
        {% if mesh_bed_before_print == 0 %}
            SHOW_MESSAGE MSG="Loading bed mesh: {bed_mesh_config}"
            BED_MESH_PROFILE LOAD={bed_mesh_config}
            G4 P5000
        {% endif %}
    {% endif %}

	_CASELIGHT_ON

    # Heats up the nozzle up to target via data from slicer
    SHOW_MESSAGE MSG="Hotend: {target_extruder}c"             # Displays info
    G1 X{x_wait} Y{y_wait} Z15 F9000                              # Goes to center of the bed
    status_heating                                                # Sets SB-leds to heating-mode
    _Party_HeatingEx                                              # Party Lights
    M109 S{target_extruder}                                       # Heats the nozzle to printing temp
    
    # Gets ready to print: purge most of the material into the trash bin (by the
    # brush, rear-right) instead of onto the print bed, then a fat prime line
    # along the FRONT border (Y=10, outside the mesh region) right before the
    # first object move -- keeps extrusion pressure fresh without leaving the
    # bulk of the purge on the bed. Reuses CLEAN_NOZZLE's own bucket geometry and
    # purge/retract lengths rather than a second magic-number copy. See adr/0015.
    SHOW_MESSAGE MSG="Printer goes brr"          # Displays info
    M141 S50                                         # Set chamber to 50 °C
    status_printing                                  # Sets SB-leds to printing-mode
    _Party_Printing                                  # Party Lights
    ##  Purge over the RIGHT bucket's centre (bucket_start + gap + right_width/2),
    ##  not tube_x -- tube_x is the scrubber TUBE and the old code deposited the
    ##  purge straight onto the brush. CLEAN_NOZZLE itself purges at this same
    ##  right-bucket centre (verified into the bin, see docs/adr/0015).
    {% set bucket_start = printer["gcode_macro CLEAN_NOZZLE"].bucket_start %}
    {% set bucket_gap = printer["gcode_macro CLEAN_NOZZLE"].bucket_gap %}
    {% set bucket_right_width = printer["gcode_macro CLEAN_NOZZLE"].bucket_right_width %}
    {% set bucket_x = bucket_start + bucket_gap + (bucket_right_width / 2) %}
    {% set bucket_top = printer["gcode_macro CLEAN_NOZZLE"].tube_top %}
    {% set bucket_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set purge_len = printer["gcode_macro CLEAN_NOZZLE"].purge_len %}
    {% set purge_spd = printer["gcode_macro CLEAN_NOZZLE"].purge_spd %}
    {% set purge_ret = printer["gcode_macro CLEAN_NOZZLE"].purge_ret %}
    G0 X{bucket_x} Y{bucket_y} F10000                 # Over the trash bin, by the brush
    G0 Z{bucket_top + 5} F1500
    M83                                               # Relative extrusion
    G1 E{purge_len / 2} F{purge_spd}                  # Two half-purges (max_extrude_only_distance caps single moves at 50mm)
    G1 E{purge_len / 2} F{purge_spd}
    RETRACT_FILAMENT LENGTH={purge_ret} SPEED={purge_spd * 5}
    G92 E0
    G0 Z20 F3000                                      # Rise fast -- molten ooze snaps as we lift
    G0 X{mesh_max_x - 5} Y10 F10000                   # Front border (Y=10), outside the mesh region
    G0 Z0.4
    ##  Slow-start prime: the purge retract leaves a void in the nozzle, so the
    ##  old short E4 line printed thin until the void refilled. Extrude while
    ##  moving to fill it, then lay a long fat line so the first object move has
    ##  real pressure behind it. ~105mm along the front border.
    G1 X{mesh_max_x - 25} Y10 E5 F600                 # slow start, primes the nozzle
    G1 X{mesh_max_x - 105} Y10 E11 F2000              # long fat prime line
    G92 E0
    M82                                               # Back to absolute extrusion
    G90

###################################
#           Print End             #
###################################
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
variable_bed_target: 0          ## set by PRINT_START; see the note there
## Seconds the post-print light show runs. MUST be declared on PRINT_END: a macro's
## variable_* names are only in scope inside that same macro, so declaring it on
## PRINT_START rendered {party_seconds} as EMPTY here -- 'UPDATE_DELAYED_GCODE
## ID=_PARTY_FINISH DURATION=' failed to parse, which aborted PRINT_END and marked
## a finished print as cancelled.
variable_party_seconds: 120
## Standby holds this FRACTION of the print's bed target, not the full value
## (0.85 -> a 105c print stands by at 89c). See docs/adr/0005 revisions.
## Scaling happens HERE rather than inside STANDBY_WARM on purpose: PRINT_END is
## the only automatic caller and it passes the print target explicitly, so
## STANDBY_WARM keeps its literal "hold exactly this" contract. Scaling inside
## STANDBY_WARM would compound on every call -- a bare re-invocation while
## standby was already holding would read back the already-scaled bed target and
## ratchet it down (105 -> 89 -> 76 -> 64...).
variable_standby_factor: 0.85
gcode:
    CANCEL_HEAT_SOAK
    M400                           # wait for buffer to clear
    _RESET_VELOCITY_LIMITS         # slicer SET_VELOCITY_LIMIT values do not reset themselves (adr/0018)
    G92 E0                         # zero the extruder
    G1 E-3.0 F1500                 # retract filament
    G91                            # relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    # move nozzle to remove stringing
    ## bed_target comes from PRINT_START, not from heater_bed.target -- the slicer
    ## has already zeroed that by the time we get here (docs/adr/0005).
    {% set bed_was = bed_target|float %}
    TURN_OFF_HEATERS
    ## Re-engage standby IMMEDIATELY after TURN_OFF_HEATERS, not at the end of the
    ## macro. PRINT_END takes ~2 min to finish (the G4 party dwell below), and the
    ## bed was cooling for all of it before standby kicked in -- which is most of
    ## what standby is meant to prevent.
    ##  The >= 90 gate tests the PRINT target, not the standby temperature -- the
    ##  question is "was this an ABS-range print?", which the scaled hold value
    ##  would answer wrongly (0.85 * 90 = 76.5 and standby would stop engaging
    ##  for exactly the prints it exists for).
    {% if bed_was >= 90 %}
        STANDBY_WARM TEMP={ (bed_was * standby_factor) | round(0) }
    {% endif %}
    _Party_Idle                    # Party Lights
    M141 S40                       # pull Chamber temp down to 40*C
    PARTS_FAN_OFF                  # turn off part cooling fan
    _Party_Cleaning                # Party Lights
    # CLEAN_NOZZLE                   # Call nozzle cleaning macro
    G1 Z100 F3000                  # move nozzle up 100mm
    G90                            # absolute positioning
    G0  X50 Y325 F3600            # park nozzle at left rear
    ##  Only release the motors when we are NOT going into standby.
    ##  quad_gantry_level.applied is reset by exactly one thing -- the
    ##  "stepper_enable:motor_off" event (see klippy/extras/z_tilt.py) -- so an M84
    ##  here is what forces the next print to run TWO quad gantry levels: the
    ##  conditional pre-QGL plus the real one. Holding the motors keeps the gantry
    ##  where QGL left it, so _QUAD_GANTRY_LEVEL_IF_NEEDED skips itself and only
    ##  the post-soak QGL runs.
    ##  Motors are released when standby expires (or by [idle_timeout] at 30 min),
    ##  so a genuinely cold start still gets both QGL passes.
    {% if bed_was < 90 %}
        M84                        # Turn off motors (no standby -- cold-ish stop)
    {% else %}
        { action_respond_info("Standby: holding motors so QGL stays valid") }
    {% endif %}
    # RESTART_CROWSNEST -- macro is not defined anywhere; Klipper logged
    # "Unknown command" on every print. Klipper cannot restart a systemd
    # service anyway. Crowsnest is separately broken (webcam returns 502).
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE=0
    ##  The party lights used to be `_Party_Idle; G4 P120000; Party_Off`, i.e. a
    ##  BLOCKING two-minute dwell -- two minutes per print where the machine was
    ##  finished but not available. Handed to a delayed_gcode instead so PRINT_END
    ##  returns immediately and the lights play on their own.
    _Party_Idle                    # start the idle light state
    UPDATE_DELAYED_GCODE ID=_PARTY_FINISH DURATION={party_seconds}
    BED_MESH_CLEAR

    ##  Leave the toolhead LEDs showing the standby colour while standby is still
    ##  holding the bed and the motors -- the machine is NOT cold and NOT safe to
    ##  reach into, so it should not look switched off. STATUS_READY already uses a
    ##  colour named 'standby' (dim white) in _sb_vars.
    ##  (PRINT_END no longer calls Status_Off -- removed 2026-07-25, see adr/0011.)
    ##  _STANDBY_WARM_OFF turns them off when standby expires.
    {% if bed_was >= 90 %}
        STATUS_READY
    {% endif %}


###################################
#        Motion limit reset        #
###################################
##  OrcaSlicer emits SET_VELOCITY_LIMIT on nearly every feature change and never
##  restores the [printer] values at the end. A cancelled print leaves the last
##  value stuck (ACCEL=250 after a bridge, seen on the screen 2026-09-18) and
##  Klipper only forgets it on RESTART. Called from PRINT_END and _USER_CANCEL.
##  See docs/adr/0018-reset-velocity-limits-after-print.md.
[gcode_macro _RESET_VELOCITY_LIMITS]
description: Restore the [printer] motion limits after a print ends or is cancelled
gcode:
    {% set p = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={p.max_velocity} ACCEL={p.max_accel} SQUARE_CORNER_VELOCITY={p.square_corner_velocity|default(5)} MINIMUM_CRUISE_RATIO={p.minimum_cruise_ratio|default(0.5)}

###################################
#
# 	Pause / Resume / Cancel
#
#   These three macros used to be defined here. They never ran: mainsail.cfg
#   defines all three too, and because [include mainsail.cfg] is the LAST include
#   in klippy.conf it won every merge (Klipper merges duplicate sections with
#   last-loaded-wins). Confirmed live -- rename_existing was PAUSE_BASE /
#   RESUME_BASE / CANCEL_PRINT_BASE, i.e. mainsail's, not these.
#
#   mainsail.cfg declares itself read-only and is managed by Moonraker's update
#   manager, so it is kept as the owner. The behaviour that was genuinely missing
#   is reattached through the supported extension point, _CLIENT_VARIABLE.
#
#   See docs/adr/0002-mainsail-owns-client-macros.md
#         and printer/macros/client_variables.cfg
#
###################################
