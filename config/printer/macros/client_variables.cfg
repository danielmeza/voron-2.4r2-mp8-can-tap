###############################################################################
# Mainsail / KlipperScreen client macro configuration
#
# mainsail.cfg owns PAUSE / RESUME / CANCEL_PRINT (see
# docs/adr/0002-mainsail-owns-client-macros.md). This is the supported way to
# extend them without editing that read-only, auto-updated file.
#
# NOTE: the user_*_macro variables accept a SINGLE LINE only, so each points at
# a macro defined below.
###############################################################################

[gcode_macro _CLIENT_VARIABLE]
variable_park_at_cancel   : True
variable_park_at_cancel_x : 175                                       # bed centre X (350 bed)
variable_park_at_cancel_y : 340                                       # rear, clear of the part
variable_idle_timeout     : 43200                                     # 12h while paused, as the old PAUSE did
variable_runout_sensor    : "filament_switch_sensor sfs_switch"       # exact object name; gates RESUME in mainsail.cfg
variable_user_pause_macro : "_USER_PAUSE"
variable_user_resume_macro: "_USER_RESUME"
variable_user_cancel_macro: "_USER_CANCEL"
gcode:

[gcode_macro _USER_PAUSE]
description: Runs after mainsail's PAUSE_BASE
gcode:
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE=0
    STATUS_BUSY

[gcode_macro _USER_RESUME]
description: Runs before mainsail's RESUME_BASE
gcode:
    ## mainsail's RESUME restores the hotend only after an idle timeout. A filament
    ## change in the pause (LOAD/UNLOAD_FILAMENT heat to 250) would otherwise resume
    ## at that temperature. See docs/adr/0002-mainsail-owns-client-macros.md (2026-11-12).
    {% set saved = printer['gcode_macro RESUME'].last_extruder_temp %}
    {% if saved.restore and saved.temp|float > 0 and printer.extruder.target|float != saved.temp|float %}
        RESPOND MSG="Resume: hotend {printer.extruder.target|float} -> {saved.temp|float}c (print temperature)"
        M109 S{saved.temp|float}
    {% endif %}
    {% set enabled = printer['gcode_macro PRINT_START'].filament_sensor_enabled|default(0)|int %}
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE={enabled}
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE={enabled}
    STATUS_PRINTING

[gcode_macro _USER_CANCEL]
description: Runs before mainsail's CANCEL_PRINT_BASE
gcode:
    # Only the bits mainsail's CANCEL_PRINT does NOT already do. It already
    # handles TURN_OFF_HEATERS, M106 S0, retract and park -- duplicating those
    # moves here would fight it.
    CANCEL_HEAT_SOAK                  # a soak currently survives a cancel
    _RESET_VELOCITY_LIMITS            # slicer accel/SCV values survive a cancel otherwise (adr/0018)
    STOP_STANDBY_WARM                 # do not leave the bed holding temperature
    M141 S40                          # pull the chamber back down
    PARTS_FAN_OFF
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE=0
    BED_MESH_CLEAR
    STATUS_OFF
