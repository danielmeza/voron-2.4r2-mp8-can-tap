# Possible Party LED macros:
# Party_2
# _Party_Leveling
# _Party_Homing
# _Party_Heating
# _Party_Cleaning
# _Party_Calibrating
# _Party_Printing
# _Party_Idle
# Party_Off
# Party_On

[gcode_macro Party_On]
gcode:
    _CASELIGHT_ON
    {action_respond_info("Party On")}

[gcode_macro Party_Off]
 gcode:
    _CASELIGHT_OFF
    {action_respond_info("Party Off")}

[gcode_macro _Party_Leveling]
gcode:
    STATUS_LEVELING

[gcode_macro _Party_Homing]
gcode:
    STATUS_HOMING

[gcode_macro _Party_Heating]
gcode:
    STATUS_HEATING

[gcode_macro _Party_HeatingEx]
gcode:
    STATUS_HEATING

[gcode_macro _Party_Cleaning]
gcode:
    STATUS_CLEANING

[gcode_macro _Party_Calibrating]
gcode:
    STATUS_CALIBRATING_Z
[gcode_macro _Party_Printing]
gcode:
    STATUS_PRINTING

[gcode_macro _Party_Idle]
gcode:
    STATUS_READY


###############################################################################
# End of the post-print light show.
#
# PRINT_END used to do `_Party_Idle; G4 P120000; Party_Off` -- a BLOCKING two
# minute dwell, so the printer sat unavailable after every print purely for the
# lights. PRINT_END now schedules this instead and returns immediately.
#
# Standby has to survive it: if the bed is still being held warm, keep the
# standby colour on rather than going dark, because a lit toolhead is the
# signal that the bed is hot and the motors are energised (docs/adr/0011).
###############################################################################

[delayed_gcode _PARTY_FINISH]
gcode:
    Party_Off                       # caselights off
    {% if printer.heater_bed.target > 0 %}
        STATUS_READY                # standby still holding -- keep signalling it
    {% else %}
        STATUS_OFF
    {% endif %}
