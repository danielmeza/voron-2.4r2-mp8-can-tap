###############################################################################
# Slicer compatibility shims and tuning helpers
#
# Klipper implements most Marlin tuning gcodes natively (M204, M220, M221, M117,
# M73) but not all of them. Anything it does not implement raises "Unknown
# command", which aborts the enclosing macro -- so a shim is not cosmetic.
#
# See docs/SLICER_INTEGRATION.md for the full gap analysis.
###############################################################################

[gcode_macro M900]
description: Marlin linear-advance shim -> Klipper pressure advance
# Cura's Linear Advance plugin and most Marlin-flavoured tuning gcode emit
# "M900 K<value>". Klipper has no M900, so without this the print aborts.
# Klipper's equivalent is pressure_advance, set via SET_PRESSURE_ADVANCE.
gcode:
    {% if params.K is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={params.K|float}
        { action_respond_info("M900: pressure_advance -> %.4f" % (params.K|float)) }
    {% else %}
        { action_respond_info("M900 with no K parameter - ignored") }
    {% endif %}

[gcode_macro M205]
description: Marlin jerk shim -- accepted and ignored
# Klipper has no jerk model; the equivalent knob is square_corner_velocity, which
# is a printer-wide setting rather than something a slicer should tweak per move.
# Accepting and ignoring keeps Marlin-flavoured output from aborting. Use
# SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=... to actually change it.
gcode:
    {% if params.X is defined or params.Y is defined %}
        { action_respond_info(
            "M205 ignored - Klipper uses square_corner_velocity (currently %.1f). "
            "Use SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=<v> to change it."
            % printer.configfile.settings.printer.square_corner_velocity) }
    {% endif %}

###############################################################################
# TEST_SPEED -- Ellis' speed/acceleration test
#   https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/test_speed.html
#
# Runs a diagonal + box pattern at a given speed/accel and re-homes, so any lost
# steps show up as a shifted home position. Use it for the "maximum speeds and
# accelerations" step, NOT while a print is running.
#
#   TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=5
###############################################################################

[gcode_macro TEST_SPEED]
description: Move the toolhead in a pattern at SPEED/ACCEL to find lost steps
gcode:
    {% set speed     = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set accel     = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set iterations= params.ITERATIONS|default(5)|int %}
    {% set bound     = params.BOUND|default(20)|int %}

    {% set x_min = printer.toolhead.axis_minimum.x + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = printer.toolhead.axis_minimum.y + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    { action_respond_info("TEST_SPEED: %d mm/s, %d mm/s^2, %d iterations"
                          % (speed, accel, iterations)) }

    SAVE_GCODE_STATE NAME=TEST_SPEED
    G28
    ##  Absolute, and remember the limits we are allowed to push to
    G90
    ##  ACCEL_TO_DECEL is gone in Klipper v0.12+; MINIMUM_CRUISE_RATIO replaced it.
    ##  0 means 'no minimum cruise', i.e. the old accel_to_decel = accel/2 behaviour
    ##  of letting short moves accelerate and decelerate without a cruise phase.
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO=0

    {% for i in range(iterations) %}
        ##  Diagonals -- worst case for a CoreXY, both motors at full tilt
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
        ##  Box -- single-motor moves
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
    {% endfor %}

    ##  Restore the configured limits before re-homing
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    G28
    RESTORE_GCODE_STATE NAME=TEST_SPEED
    { action_respond_info(
        "TEST_SPEED done. Compare the homed position against before the run - "
        "any shift means steps were lost at this speed/accel.") }
