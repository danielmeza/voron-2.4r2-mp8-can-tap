#####################################################################
#   BigTreeTech SFS V2.0 -- runout switch + encoder, at the spool
#
#   Blue lead  -> PF2 (ESTOP3 header): switch sensor, filament present/absent
#   Green lead -> PF1 (ESTOP4 header): motion sensor, encoder pulses
#   5V and GND come from the same endstop headers (+5V on each).
#
#   Detection accuracy is 2.88 mm on the V2, not the 7 mm of the V1.
#   Both sensors pause: the switch catches a real runout, the encoder catches
#   a jam or a slip between spool and toolhead.
#
#   These two are the only filament sensors: the EBB's toolhead sensor is not
#   installed and was removed with this change.  See
#   docs/adr/0024-sfs-v2-runout-and-jam.md
#####################################################################

[filament_switch_sensor sfs_switch]
switch_pin: ^MP8:PF2
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    M117 SFS switch: runout
insert_gcode:
    M117 SFS switch: inserted

[filament_motion_sensor sfs_motion]
switch_pin: ^MP8:PF1
detection_length: 2.88
extruder: extruder
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    M117 SFS encoder: jam
insert_gcode:
    M117 SFS encoder: moving

## Disarmed at boot, like the EBB sensor: PRINT_START arms all three from
## variable_filament_sensor_enabled, PRINT_END/PAUSE/CANCEL disarm them.
[delayed_gcode SFS_DISABLE_AT_START]
initial_duration: 1.0
gcode:
    SET_FILAMENT_SENSOR SENSOR=sfs_switch ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=sfs_motion ENABLE=0
