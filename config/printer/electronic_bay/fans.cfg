[multi_pin electronic_bay_fans]
pins: MP8:FAN0, MP8:FAN1, MP8:HE0

[controller_fan  electronic_bay]
pin: multi_pin:electronic_bay_fans
max_power: 1
idle_speed: 0.5
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time:0.01
off_below:0.1
fan_speed: 0.6
heater: heater_bed

## Turbine over the stepper drivers (Printables 1024769 airduct).  Runs while
## any stepper moves and stays on through idle_timeout, so a long print keeps
## the drivers cooled between moves.  FAN5 is a 4-pin header: PA6 = PWM out
## (blue lead), PC2 = FG/tach (yellow lead), VF5 jumper on 12V.
##
## tachometer_ppr 4 is measured, not guessed: ppr 2 read 7106 rpm at 100 %,
## above the 4000 rpm datasheet maximum; at ppr 4 the same run reads 3553 rpm
## at 100 % and 818 rpm at 15 %, against the datasheet's 800 rpm floor.
##
## shutdown_speed 1.0 on purpose: a Klipper or MCU error must leave the
## drivers cooling, not stop the fan.
## See docs/adr/0023-fan5-four-wire-sunon.md
[controller_fan drivers]
pin: MP8:FAN5_P1
hardware_pwm: true
cycle_time: 0.00004
max_power: 1
shutdown_speed: 1.0
off_below: 0.1
tachometer_pin: MP8:FAN5_P2
tachometer_ppr: 4
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3
fan_speed: 1
idle_timeout: 120

## Auxiliary fan for the Manta and the CB1 ("CPU"), which sits off the heatsink
## and is therefore the part that runs hottest.  FAN6's fan is the turbine-type
## SUNON MagLev (green = PWM, yellow = FG); model number not recorded yet, so
## confirm it is a 12V unit and the VF6 jumper matches before running it.
## PA2 = PWM out, PC1 = FG/tach.
##
## shutdown_speed 1.0 on purpose: a Klipper or MCU error must leave the board
## fans running.  PID instead of watermark so min_speed is honoured: a
## watermark controller sends an exact 0 and Klipper leaves it there, so a
## 4-wire fan would stop.  This is a PI loop that holds the host at 55 C:
## below it the fan settles at the 10 % floor, above it the fan ramps (pid_Kp 25
## is ~0.1 speed per degree) and the integral keeps pushing until 55 C is back.
## The target sits above the host's idle temperature on purpose -- at 45 C the
## fan never left 100 %.
## See docs/adr/0023-fan5-four-wire-sunon.md
[temperature_fan manta]
pin: MP8:FAN6_P1
hardware_pwm: true
cycle_time: 0.00004
max_power: 1
shutdown_speed: 1.0
tachometer_pin: MP8:FAN6_P2
tachometer_ppr: 2
sensor_type: temperature_host
min_temp: 0
max_temp: 100
target_temp: 55
control: pid
pid_Kp: 25
pid_Ki: 0.02
pid_Kd: 0
min_speed: 0.1
max_speed: 1.0
