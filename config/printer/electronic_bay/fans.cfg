[multi_pin electronic_bay_fans]
pins: MP8:FAN0, MP8:FAN1, MP8:HE0

[controller_fan  electronic_bay]
pin: multi_pin:electronic_bay_fans
max_power: 1
idle_speed: 0.5
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time:0.01
off_below:0.1
fan_speed: 0.6
heater: heater_bed

## SUNON MF60101V1-1Q03C-S99, 12V 1.46W 4-wire.  FAN5 is a 4-pin header:
## PA6 = PWM out (blue lead), PC2 = FG/tach (yellow lead), VF5 jumper on 12V.
## See docs/adr/0023-fan5-four-wire-sunon.md
[fan_generic Sunon]
pin: MP8:FAN5_P1
hardware_pwm: true
cycle_time: 0.00004
off_below: 0.1
shutdown_speed: 0.0
tachometer_pin: MP8:FAN5_P2
tachometer_ppr: 2

## Second 4-wire fan (turbine-type SUNON MagLev, green = PWM, yellow = FG).
## Model number not recorded yet; confirm it is 12V, then set the VF6
## jumper to match before running.  PA2 = PWM out, PC1 = FG/tach.
## The schematic names this header's nets Cool_PWM / Cool-TACH (P20,
## "SysCooling"), which is what FAN6_P1 / FAN6_P2 alias here.
## See docs/adr/0023-fan5-four-wire-sunon.md
[fan_generic SunonTurbine]
pin: MP8:FAN6_P1
hardware_pwm: true
cycle_time: 0.00004
off_below: 0.1
shutdown_speed: 0.0
tachometer_pin: MP8:FAN6_P2
tachometer_ppr: 2
