## PSU relay control -- see docs/adr/0022-power-off-relay-on-ps-on.md
## Manta M8P v2.0 PS-ON header (J18): pin 2 PD14, pin 1 GND -> the relay
## module's MIDDLE header, PD14 on "S", GND on "G".  S high keeps mains on;
## S low cuts mains 7.5 s later and the module stays off until it loses mains
## or 5V-RST is bridged.  The module powers itself from mains: its 5V_IN header
## is only a short-circuit sense input and is not needed.
##
## This section alone cannot beat the module's first deadline (15.5 s after
## power-on; CB1 + Klipper take longer).  PD14 is driven high from MCU reset by
## CONFIG_INITIAL_PINS="PD14" in firmware/manta-m8p-h723.config.
[output_pin PS_ON]
pin: MP8:PD14
pwm: false
value: 1
shutdown_value: 1

## Measured 2026-11-11: PD14 reads 1.0 during startup and 0.0 once Klipper
## reaches "ready" (reproduced with nothing in the gcode store), so the start
## value alone does not hold it.  Re-assert after startup; the root cause is
## still open -- see docs/adr/0022-power-off-relay-on-ps-on.md, Revisions.
[delayed_gcode PSU_RELAY_ASSERT]
initial_duration: 2.0
gcode:
    SET_PIN PIN=PS_ON VALUE=1
