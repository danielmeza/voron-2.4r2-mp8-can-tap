## PSU relay control -- see docs/adr/0022-power-off-relay-on-ps-on.md
## Manta M8P v2.0 PS-ON header: GND + PD14.  Held high from boot so an
## external BIGTREETECH Relay V1.2 keeps mains closed; POWER_OFF releases it.
[output_pin PS_ON]
pin: MP8:PD14
pwm: false
value: 1
shutdown_value: 1

## FAN4 was tried first, as an `[output_pin psu_relay_5v]` on MP8:FAN4 with the
## VF4 jumper on 5V.  In practice it did not deliver: the module dropped the
## relay a few seconds after boot.  The module's 5V IN now comes from the
## board's 5V-DET header (+5V / GND, live as soon as the board is powered), so
## FAN4 is free again.  See docs/adr/0022-power-off-relay-on-ps-on.md, Revisions.

## Measured 2026-11-11: PD14 reads 1.0 during startup and 0.0 once Klipper
## reaches "ready" (reproduced with nothing in the gcode store), so the start
## value alone does not hold it.  Re-assert after startup; the root cause is
## still open -- see docs/adr/0022-power-off-relay-on-ps-on.md, Revisions.
[delayed_gcode PSU_RELAY_ASSERT]
initial_duration: 2.0
gcode:
    SET_PIN PIN=PS_ON VALUE=1
