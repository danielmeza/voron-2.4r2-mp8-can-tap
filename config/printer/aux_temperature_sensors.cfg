###############################################################################
# Frame temperature sensing  --  TIER B, NOT YET INSTALLED
#
# Everything below is commented out until the thermistors are physically fitted.
# See docs/adr/0004-frame-temperature-sensing.md and docs/TUNING_PLAN.md.
#
# WHY: what actually moves Z is the temperature of the *vertical Z extrusions*,
# not chamber air. The existing chamber sensor is a BME280 measuring air, which
# is the wrong signal for thermal-drift compensation.
#
# HARDWARE: 2-wire NTC 100K 3950 with an M3 ring lug, bolted into a T-nut on
# each vertical Z corner pillar. The MP8 has four free thermistor ports
# (TH0/TH1/TH2/TH3 -- only THB is used by the bed).
#
# Fit one first (TH1) to get z_thermal_adjust working. Fitting all four is what
# reveals *uneven* frame heating, which tilts the gantry and is a direct
# suspect for first-layer error that varies across the bed.
###############################################################################

## ---- Step 1: one sensor, rear-left pillar -----------------------------------
#[temperature_sensor frame_rear_left]
#sensor_type: Generic 3950
#sensor_pin: MP8:TH1
#min_temp: 0
#max_temp: 100

## ---- Step 2 (optional): the remaining three pillars -------------------------
#[temperature_sensor frame_rear_right]
#sensor_type: Generic 3950
#sensor_pin: MP8:TH2
#min_temp: 0
#max_temp: 100
#
#[temperature_sensor frame_front_left]
#sensor_type: Generic 3950
#sensor_pin: MP8:TH3
#min_temp: 0
#max_temp: 100
#
#[temperature_sensor frame_front_right]
#sensor_type: Generic 3950
#sensor_pin: MP8:TH0
#min_temp: 0
#max_temp: 100

## ---- Step 3 (only with all four): one virtual frame sensor ------------------
## NOTE: 'temperature_combined' is a sensor_TYPE (registered via
## add_sensor_factory), not a section of its own -- it goes inside a normal
## [temperature_sensor] block.
##
## maximum_deviation makes Klipper RAISE AN ERROR if the pillars disagree by
## more than this -- i.e. it actively detects uneven frame heating rather than
## averaging it away. Start loose (10c) and tighten once you know the spread.
#[temperature_sensor frame]
#sensor_type: temperature_combined
#sensor_list: temperature_sensor frame_rear_left, temperature_sensor frame_rear_right, temperature_sensor frame_front_left, temperature_sensor frame_front_right
#combination_method: mean
#maximum_deviation: 10
#min_temp: 0
#max_temp: 100

## ---- Step 4: live Z compensation for frame expansion ------------------------
## z_thermal_adjust defines its OWN sensor inline (it calls heaters.setup_sensor
## on its own config), so it takes sensor_type/sensor_pin directly. With all four
## pillars fitted it can average them itself using the combined sensor type --
## swap the two commented lines below for the sensor_list form.
##
## temp_coeff MUST be calibrated -- 0.02 mm/degC is only a starting ballpark for
## aluminium. Procedure: cold-home Z and note the offset; heat soak fully;
## re-home and note the change; temp_coeff = delta_Z / delta_T. Sign matters: a
## frame that grows pushes the nozzle away from the bed.
## Keep max_z_adjustment small (0.2mm) as a safety net while calibrating.
#[z_thermal_adjust]
#temp_coeff: 0.0
#smooth_time: 30
#max_z_adjustment: 0.2
#sensor_type: Generic 3950
#sensor_pin: MP8:TH1
##  -- or, with all four pillars fitted, average them directly:
##sensor_type: temperature_combined
##sensor_list: temperature_sensor frame_rear_left, temperature_sensor frame_rear_right, temperature_sensor frame_front_left, temperature_sensor frame_front_right
##combination_method: mean
##maximum_deviation: 10
#min_temp: 0
#max_temp: 100
