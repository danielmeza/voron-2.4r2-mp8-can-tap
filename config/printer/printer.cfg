# [virtual_sdcard] is owned by mainsail.cfg (path: ~/printer_data/gcodes, which
# resolves to the same directory). It was defined here too and silently lost the
# merge, since mainsail.cfg is the last include. See docs/adr/0001.

[printer]
kinematics: corexy

max_velocity: 400 
max_accel: 5700

max_z_velocity: 20
max_z_accel: 350
square_corner_velocity: 8.0

[respond]
default_type: echo
default_prefix:
