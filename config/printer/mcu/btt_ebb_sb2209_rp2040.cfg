############################################
## Bigtreetech EBB SB2209 VAN v1 (RP2040) ##
############################################
[mcu EBB]
canbus_uuid: 19de38651b72

## Board thermistor (gpio28) now drives a cooling fan on the SB2209's own IND/FAN
## header (VIN / GND / GPIO6, jumper on FAN). The board reached 78.5c with the chamber
## at 46.6c and shut down with "Timer too close" after 2h17 of ABS on 2026-09-20; the
## RP2040 is rated to 85c and runs CAN in software (PIO), so it is the first thing to
## fail when hot. This replaces [temperature_sensor EBB]; the reading is still shown
## as "EBB". See docs/adr/0020-cool-the-toolhead-board.md.
## max_temp is a SHUTDOWN threshold for a temperature_fan -- kept above anything the
## board can reach so the fan section never becomes a new way to kill a print.
## 2026-11-12: the board fan is dead (it failed the first time its tach was wired
## to the GPIO6 pin), so the fan section is commented out until the replacement
## arrives and the plain sensor is back -- the board reading must stay visible.
## The board is UNCOOLED meanwhile: long ABS prints reached 78 C and died with
## "Timer too close" before the fan.  See docs/adr/0020-cool-the-toolhead-board.md.
[temperature_sensor EBB]
sensor_type: Generic 3950
sensor_pin: EBB:gpio28

#[temperature_fan EBB]
#pin: EBB:BOARD_FAN
#sensor_type: Generic 3950
#sensor_pin: EBB:gpio28
#min_temp: 0
#max_temp: 100
#target_temp: 50
#control: watermark
#max_delta: 3
#min_speed: 0
#max_speed: 1
#off_below: 0.25
#kick_start_time: 0.5
## Tach: the fan's yellow wire goes to pin 5 of the SB2209's Probe connector
## (PROBE -> 74LVC2G17 buffer -> GPIO21; TAP uses pin 3, GPIO22) through a
## Schottky diode (BAT54/1N5819, band toward the fan), with a 10k pull-up from
## pin 5 to pin 2 (+5V): the buffer input has none, and the RP2040's own pull-up
## sits behind the buffer.  GPIO6 switches the fan's negative, so while the fan
## is off its yellow wire can float toward 24 V; the diode keeps that off the
## buffer.  Valid while the fan is on -- watermark runs it at 0 or 100 %.
## See docs/adr/0020-cool-the-toolhead-board.md.
#tachometer_pin: EBB:BOARD_FAN_TACH
#tachometer_ppr: 2
## A 3010 at ~14000 rpm needs a poll under 30/(ppr*rpm) = 1.1 ms; the 1.5 ms
## default would miss pulses.
#tachometer_poll_interval: 0.0005


[adxl345]
cs_pin: EBB: ADXL_CS
spi_software_sclk_pin: EBB: ADXL_CLK
spi_software_mosi_pin: EBB: ADXL_MOSI
spi_software_miso_pin: EBB: ADXL_MISO
#   The SPI speed (in hz) to use when communicating with the chip.
#   The default is 5000000.
spi_speed: 5000000

#   Output data rate for ADXL345. ADXL345 supports the following data
#   rates: 3200, 1600, 800, 400, 200, 100, 50, and 25. Note that it is
#   not recommended to change this rate from the default 3200, and
#   rates below 800 will considerably affect the quality of resonance
#   measurements.
rate: 3200

#   The accelerometer axis for each of the printer's X, Y, and Z axes.
#   This may be useful if the accelerometer is mounted in an
#   orientation that does not match the printer orientation. For
#   example, one could set this to "y, x, z" to swap the X and Y axes.
#   It is also possible to negate an axis if the accelerometer
#   direction is reversed (eg, "x, z, -y"). The default is "x, y, z".
## axes_map from BTT's official sample config for this exact board:
##   github.com/bigtreetech/EBB -> "EBB SB2209 CAN (RP2040)" sample cfg
## The ADXL is mounted vertically on the toolhead, so the sensor's axes do NOT
## line up with the printer's. Verified empirically: with the old identity map
## (x,y,z) a stationary ACCELEROMETER_QUERY reported gravity (~9550) on the
## sensor's X axis instead of Z -- i.e. Klipper was told sensor-X was printer-X
## while it was actually pointing UP. Any resonance measurement taken that way
## describes the wrong axes.
axes_map: z,-y,x

[board_pins EBB]
mcu: EBB
aliases:
aliases_end_stops:
    ESTOP0=gpio24

aliases_board:
    BOARD_FAN=gpio6

aliases_sb0000:
    RGB=gpio16,
    NEOPIXEL=RGB,
    TACH=gpio12,
    PWM=gpio15,
    HOTEND_FAN=gpio14,
    PARTS_FAN=gpio13

aliases_extruder_motor:
    MOTOR_EN=gpio17,
    MOTOR_STEP=gpio18,
    MOTOR_DIR=gpio19

aliases_canbus:
    CAN_H=gpio4,
    CAN_L=gpio5,
    CAN_RX=CAN_H,
    CAN_TX=CAN_L

aliases_heaters:
    HE=gpio7

aliases_thermistors:
    TH=gpio27,
    PT1000=TH
aliases_uart:
    UART1=gpio20

aliases_spi:


aliases_adxl:
    ADXL_MOSI=gpio0,
    ADXL_CS=gpio1,
    ADXL_CLK=gpio2,
    ADXL_MISO=gpio3

aliases_max31865:
    MAX31865_CS=gpio9,
    MAX31865_MOSI=gpio8,
    MAX31865_SCK=gpio10,
    MAX31865_MISO=gpio11

aliases_probe:
    PROBE1=gpio21,
    PROBE2=gpio22,
    TAP_PROBE=PROBE2,
    BOARD_FAN_TACH=PROBE1



