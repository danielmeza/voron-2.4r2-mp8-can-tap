

[temperature_fan chamber]
pin: MP8:FAN3
max_power: 1
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time: 0.01
off_below: 0.1

sensor_type: BME280
i2c_mcu: MP8
i2c_software_scl_pin: MP8:I2C_SCL
i2c_software_sda_pin: MP8:I2C_SDA
min_temp: 0.0
max_temp: 70
target_temp: 40
max_delta: 1.25
control: watermark
gcode_id: C


##############################################################################
# Chamber temperature as a plain sensor, for KlipperScreen's print titlebar.
#
# The chamber is a [temperature_fan], and KlipperScreen's job_status panel only
# scans get_temp_sensors(), which returns [temperature_sensor] sections *only*
# (ks_includes/printer.py). So a temperature_fan can never appear on the print
# screen titlebar no matter what titlebar_items says.
#
# This mirrors it as a real temperature_sensor using the 'temperature_combined'
# sensor type with a single input -- no second physical sensor, no second I2C
# transaction against the BME280. temperature_fan exposes get_temp(), which is
# what temperature_combined consumes.
#
# Paired with `titlebar_items: chamber` in KlipperScreen.conf.
##############################################################################
[temperature_sensor chamber]
sensor_type: temperature_combined
sensor_list: temperature_fan chamber
combination_method: mean
maximum_deviation: 999.9
min_temp: 0
max_temp: 70

[gcode_macro SET_EXHAUST_FAN]
gcode:
    {% set s = params.S|default(0)|float %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan="chamber" target={s}

#####################################################################
# Turns off the fan 
#####################################################################
[delayed_gcode CHAMBER_FAN_OFF]
gcode:
    SET_FAN_SPEED FAN=Chamber SPEED=0