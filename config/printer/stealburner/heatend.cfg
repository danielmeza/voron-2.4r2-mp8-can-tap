###########################################
## Dragon Fly Hight Flow with PT1000 thermistor ##
###########################################
[extruder]

nozzle_diameter: 0.4

max_power: 1
min_extrude_temp: 160

heater_pin: EBB:HE

# MAX31865 block
sensor_type: MAX31865
sensor_pin: EBB:MAX31865_CS
spi_software_sclk_pin: EBB:MAX31865_SCK
spi_software_mosi_pin: EBB:MAX31865_MOSI
spi_software_miso_pin: EBB:MAX31865_MISO
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2

## PID_CALIBRATE HEATER=extruder TARGET=235, 2026-11-13, Klipper v0.13.0-827. Klipper fixed
## PID_CALIBRATE's Ku formula in this range (e761a2c7, 3ce421ba): it had been recommending
## gains ~2x too high. Was Kp 21.527 Ki 1.063 Kd 108.982 (old formula).
control: pid
pid_Kp: 14.393
pid_Ki: 1.246
pid_Kd: 41.559
min_temp: 0
max_temp: 300
