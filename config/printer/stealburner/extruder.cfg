[extruder]
filament_diameter: 1.75
gear_ratio: 50:10

# min_extrude_temp lives with the hotend definition in heatend.cfg (160)

#################################################################################
# Everything below this section differs by filament and extruder                #
# Set these to a default provided by extruder provider                          #
# Then make use of filament configuration in the slicer to set realistic values #
#################################################################################

# Use slicer to set filament configuration, pressure advance 100% differs with filament
## MEASURED 2026-07-30 with ABS via OrcaSlicer's PA Pattern method (Ellis' preferred
## method -- Calibration > Pressure Advance > Pattern). 41 blocks, 0 -> 0.08 in 0.002
## steps at 120mm/s / 3000mm/s^2. Block 11 from the left judged best: corners uniform,
## no bulge (too little PA) and no gap (too much). Was 0.055, which was inherited and
## never measured -- the real value is less than half of it.
##
## PA is FILAMENT-specific. 0.022 is the ABS value and serves as the machine default
## because ABS is what this printer runs; PLA/PETG will differ. Set it per-filament in
## the slicer's filament profile to override this.
pressure_advance: 0.022
pressure_advance_smooth_time: 0.03

## Kept on purpose but INERT by default: the OrcaSlicer printer profile has
## "Use firmware retraction" OFF, so files carry their own G1 E- retractions with
## wipe and this section receives no G10/G11. Tick the box in the printer profile
## when a value needs tuning live with SET_RETRACTION; the two never stack --
## a file uses one method or the other. See docs/adr/0021-slicer-retraction-by-default.md.
[firmware_retraction]
# The length of filament (in mm) to retract on G10, and tok unretract on G11
retract_length: 0.75

# The length (in mm) of *additional* filament to add when unretracting (G11)
unretract_extra_length: 0.05

# The speed of retraction, in mm/s
retract_speed: 35

# The speed of unretraction, in mm/s
unretract_speed: 35