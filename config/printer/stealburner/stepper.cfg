###############################################
##  Extruder Stepper - MOONS  CSE14HRA1L410A ##
###############################################
[extruder]
step_pin: EBB:MOTOR_STEP
dir_pin: EBB:MOTOR_DIR
enable_pin: !EBB:MOTOR_EN
microsteps: 16
## Calibrated 2026-07-30 via Ellis' extruder_calibration procedure (120mm mark,
## 100mm push, hot/no-disassembly): 98.60mm actual for 100mm requested.
## new = 22.78 * (98.60 / 100) = 22.46. Was 22.780000 (uncalibrated default).
rotation_distance: 22.460000
full_steps_per_rotation: 200

[tmc2209 extruder]
uart_pin: EBB:UART1
run_current: 0.5
interpolate: False
sense_resistor: 0.110
stealthchop_threshold: 0  # Set to 0 for spreadcycle, avoid using stealthchop on extruder
