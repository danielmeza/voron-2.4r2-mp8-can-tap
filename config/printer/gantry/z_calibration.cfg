[safe_z_home]
z_hop: 10
speed: 100
home_xy_position: 150, 150

[probe]
speed: 5
lift_speed: 10

## 3 -> 2. The mesh is only 9 adaptive points but samples multiply that into 27
## probe cycles, ~15s of the mesh time. Measured PROBE_ACCURACY std dev is
## 0.001858mm, so the standard error only moves from ~0.0011 to ~0.0013mm --
## 0.0002mm against a first-layer sensitivity of ~0.02mm. See docs/TUNING_PLAN.md.
samples: 2
samples_result: median
sample_retract_dist: 3

samples_tolerance: 0.005
samples_tolerance_retries: 3


[quad_gantry_level]
speed: 280
horizontal_move_z: 5

retries: 8
retry_tolerance: 0.01

max_adjust: 15

###############################################################################

[bed_mesh]
speed: 280

##   The height (in mm) that the head should be commanded to move to
##   just prior to starting a probe operation. The default is 5.
horizontal_move_z: 5

##   The interpolation algorithm to use. May be either "lagrange"
##   or "bicubic". This option will not affect 3x3 grids, which
##   are forced to use lagrange sampling.  Default is lagrange.
algorithm: bicubic

# NOTE: this block used to carry the formula for 'relative_reference_index'.
# That option no longer exists in Klipper v0.13 (it became
# 'zero_reference_position'), and neither is needed here: this printer homes Z
# with TAP via 'probe:z_virtual_endstop'.  Per Ellis' guide, a mesh reference
# point only matters with a PHYSICAL Z endstop -- with a virtual endstop the
# mesh and Z home already share the same reference.
probe_count: 11,11

##   The gcode z position in which to start phasing out z-adjustment
##   when fade is enabled.  Default is 1.0.
#fade_start: 1

##   The gcode z position in which phasing out completes.  When set
##   to a value below fade_start, fade is disabled. It should be
##   noted that fade may add unwanted scaling along the z-axis of a
##   print.  If a user wishes to enable fade, a value of 10.0 is
##   recommended. Default is 0.0, which disables fade.
#fade_end: 10

##   The z position in which fade should converge. When this value is set
##   to a non-zero value it must be within the range of z-values in the mesh.
##   Users that wish to converge to the z homing position should set this to 0.
##   Default is the average z value of the mesh.
#fade_target: 0

##   The distance (in mm) along a move to check for split_delta_z.
##   This is also the minimum length that a move can be split. Default
##   is 5.0.
move_check_distance: 3

##   The amount of Z difference (in mm) along a move that will
##   trigger a split. Default is .025.
split_delta_z: 0.0125

##   A comma separated pair of integers (X,Y) defining the number of
##   points per segment to interpolate in the mesh along each axis. A
##   "segment" can be defined as the space between each probed
##   point. The user may enter a single value which will be applied
##   to both axes.  Default is 2,2.
mesh_pps: 2,2

##   When using the bicubic algorithm the tension parameter above
##   may be applied to change the amount of slope interpolated.
##   Larger numbers will increase the amount of slope, which
##   results in more curvature in the mesh. Default is .2.
#bicubic_tension: 0.2

#TAP code:
[probe]
activate_gcode:
    STATUS_CALIBRATING_Z
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

[gcode_macro PRINT_TAP_STATE]
gcode:
    M117 TAP State: { printer.probe.last_query }

[gcode_macro _QUAD_GANTRY_LEVEL_IF_NEEDED]
gcode:
    SHOW_MESSAGE MSG="Checking gantry level"
    {% if printer.quad_gantry_level.applied == False %}
        SHOW_MESSAGE MSG="Gantry not level, leveling"
         _CASELIGHT_OFF
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 ; home if not already homed
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
        _CASELIGHT_ON
        SHOW_MESSAGE MSG="Gantry level complete"
    {% else %}
        SHOW_MESSAGE MSG="Gantry level already applied"
    {% endif %}