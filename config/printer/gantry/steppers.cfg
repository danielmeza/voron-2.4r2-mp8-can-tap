##################################################
##  Motor/kinematic settings for the gantry.     ##
##                                                ##
##  Driver settings (uart_pin, run_current,       ##
##  interpolate, sense_resistor, stealthchop) are ##
##  owned by stepper_drivers.cfg -- do not        ##
##  redefine them here.  Klipper merges duplicate ##
##  sections silently and the last file loaded    ##
##  wins, which previously left the four Z motors ##
##  running at mismatched currents.               ##
##                                                ##
##  The extruder is a toolhead part and is owned  ##
##  entirely by stealburner/stepper.cfg.          ##
##################################################

##################################################
##      Left B Stepper - LDO-42STH48-2004AH     ##
##################################################

[stepper_x]
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200

##################################################
##      Right A Stepper - LDO-42STH48-2004AH    ##
##################################################

[stepper_y]
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200

##################################################
##   Front Left Z0 Stepper - OMC 17HS24-2104S   ##
##################################################

[stepper_z]
microsteps: 32
gear_ratio: 80:16
rotation_distance: 40

##################################################
##   Rear Left Z1 Stepper - OMC 17HS24-2104S    ##
##################################################

[stepper_z1]
microsteps: 32
gear_ratio: 80:16
rotation_distance: 40

##################################################
##   Rear Right Z2 Stepper - OMC 17HS24-2104S   ##
##################################################

[stepper_z2]
microsteps: 32
gear_ratio: 80:16
rotation_distance: 40

##################################################
##   Front Right Z3 Stepper - OMC 17HS24-2104S  ##
##################################################

[stepper_z3]
microsteps: 32
gear_ratio: 80:16
rotation_distance: 40
