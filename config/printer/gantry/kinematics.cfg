[stepper_x]
endstop_pin: EBB:ESTOP0

position_min: 0
position_max: 350.01
position_endstop: 350

homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
endstop_pin: MP8:ESTOP2

position_min: 0
position_max: 350.01
position_endstop: 350

homing_speed: 100  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[probe]
pin: !EBB:TAP_PROBE

x_offset: 0
y_offset: 0
## 2026-07-30: paper test gave -0.529 as a rough starting point (Klipper's official
## method, klipper3d.org/Bed_Level.html -- friction-felt position IS z=0, no
## paper-thickness subtraction). Refined with SQUISH_TEST_GRID
## (macros/squish_test.cfg, docs/adr/0016): 9 squares, 0.04mm steps around -0.529.
## Back-left square (row2,col0, delta +0.08) judged best -- fully fused lines, no
## gaps, resists a peel test. -0.529 + 0.08 = -0.449. Was -0.514, then -0.529.
z_offset: -0.449


[stepper_z]
endstop_pin: probe:z_virtual_endstop

position_max: 300
position_min: -5

homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 5

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420

points:
   50,25
   50,275
   300,275
   300,25

[bed_mesh]
mesh_min: 30,30
mesh_max: 320,320