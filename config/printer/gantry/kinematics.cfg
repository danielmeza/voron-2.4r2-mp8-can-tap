[stepper_x]
endstop_pin: EBB:ESTOP0

position_min: 0
position_max: 350.01
position_endstop: 350

homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[stepper_y]
endstop_pin: MP8:ESTOP2

position_min: 0
position_max: 350.01
position_endstop: 350

homing_speed: 100  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[probe]
pin: !EBB:TAP_PROBE

x_offset: 0
y_offset: 0
## 2026-07-30: paper test gave -0.529 as a rough starting point (Klipper's official
## method, klipper3d.org/Bed_Level.html -- friction-felt position IS z=0, no
## paper-thickness subtraction). Refined with SQUISH_TEST_GRID
## (macros/squish_test.cfg, docs/adr/0016): 9 squares, 0.04mm steps around -0.529.
## Back-left square (row2,col0, delta +0.08) judged best -- fully fused lines, no
## gaps, resists a peel test.
## 2026-08-02 sign fix: the +0.08 winner wanted the nozzle HIGHER (SET_GCODE_OFFSET
## Z=+0.08 adds to base_position, raising the toolhead -- verified in
## klippy/extras/gcode_move.py), and Klipper's own conversion for baking a babystep
## in is Z_OFFSET_APPLY_PROBE (probe.py): new = z_offset - offset. So the correct
## value is -0.529 - 0.08 = -0.609, NOT -0.529 + 0.08 = -0.449. With z_offset used
## as the Z position_endstop, -0.449 sat the nozzle 0.08mm BELOW the paper-test
## zero the grid had already judged too squished (0.16mm off the tested optimum) --
## crushed first layers, prints short by ~0.3-0.5mm. Was -0.514, -0.529, -0.449.
## 2026-08-02 (2nd grid, larger 25mm bordered squares): center baseline judged best
## vertical pattern; its small fill/wall junction gaps are a FLOW/PA artifact, not
## under-squish. A -0.04mm more-squish candidate (-0.569) closed the joins but made
## EVERY square over-squish (raised line borders) -- grid verdict: -0.609 is the
## correct Z contact. Do NOT bake -0.569. History: -0.514, -0.529, -0.449, -0.609.
## 2026-08-02 (final check): fine grid at Z_STEP=0.002 (center +/-0.008mm) --
## center square (delta 0) confirmed BEST. -0.609 verified optimum, no change.
## Join gaps at correct squish are a flow/PA artifact, not a Z issue.
z_offset: -0.609


[stepper_z]
endstop_pin: probe:z_virtual_endstop

position_max: 300
position_min: -5

homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 5

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420

points:
   50,25
   50,275
   300,275
   300,25

[bed_mesh]
mesh_min: 30,30
mesh_max: 320,320