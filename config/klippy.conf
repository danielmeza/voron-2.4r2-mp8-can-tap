##############################################
# Edit configuration in printer/ and macros/ #
##############################################

[save_variables]
filename: ~/printer_data/config/save_variables.cfg

[idle_timeout]
timeout: 1800

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 0.1

[respond]
[exclude_object]

# NOTE: glob.glob() is not called recursively by Klipper, so '**' behaves
# exactly like '*' -- these two lines cover printer/*.cfg and printer/<dir>/*.cfg,
# which already includes printer/macros/.  (Separate macros/*.cfg includes used
# to sit here and matched nothing, silently, because they are wildcards.)
[include printer/*.cfg]
[include printer/**/*.cfg]

[include mainsail.cfg]

