[printer Printer]
# Extra temperature devices shown on the print screen titlebar.
# IMPORTANT: no square brackets anywhere in this file except real section
# headers. KlipperScreen validates with a regex that does not skip comments,
# so a closing bracket followed by any character - even inside a comment -
# raises 'Section headers have extra information after brackets'.
# Only temperature_sensor devices are eligible here; the chamber is mirrored
# as one in printer/chamber/fans.cfg.
titlebar_items: chamber


